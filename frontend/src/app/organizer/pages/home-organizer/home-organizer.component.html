<div class="content">
  <div class="search-filter-section">
    <search class="search-section">
      <div class="search-input-wrapper">
        <i class="bi bi-search search-icon" aria-hidden="true"></i>
        <label for="org-search" class="visually-hidden">Tìm kiếm sự kiện</label>
        <input
          id="org-search"
          type="search"
          placeholder="Tìm kiếm theo tên, địa điểm..."
          class="search-input"
          [(ngModel)]="searchTerm"
          (input)="onSearchChange()"
        />
        <button
          *ngIf="searchTerm"
          class="clear-search-btn"
          (click)="clearSearch()"
          type="button"
          aria-label="Xóa từ khóa tìm kiếm"
        >
          <i class="bi bi-x" aria-hidden="true"></i>
        </button>
      </div>
    </search>

    <div class="filter-tab" role="tablist" aria-label="Trạng thái sự kiện">
      <button
        type="button"
        role="tab"
        class="filter-btn"
        [class.active]="selectedTab === 'ongoing'"
        [attr.aria-selected]="selectedTab === 'ongoing'"
        (click)="setTab('ongoing')"
      >
        Đang diễn ra
      </button>
      <button
        type="button"
        role="tab"
        class="filter-btn"
        [class.active]="selectedTab === 'upcoming'"
        [attr.aria-selected]="selectedTab === 'upcoming'"
        (click)="setTab('upcoming')"
      >
        Sắp tới
      </button>
      <button
        type="button"
        role="tab"
        class="filter-btn"
        [class.active]="selectedTab === 'past'"
        [attr.aria-selected]="selectedTab === 'past'"
        (click)="setTab('past')"
      >
        Đã qua
      </button>
      <button
        type="button"
        role="tab"
        class="filter-btn"
        [class.active]="selectedTab === 'pending'"
        [attr.aria-selected]="selectedTab === 'pending'"
        (click)="setTab('pending')"
      >
        Chờ duyệt
      </button>
    </div>
  </div>

  <div class="events-list">
    <app-ongoing
      *ngIf="selectedTab === 'ongoing'"
      [events]="filteredEvents"
      (eventsSelected)="onEventSelected($event)">
    </app-ongoing>

    <app-upcoming
      *ngIf="selectedTab === 'upcoming'"
      [events]="filteredEvents"
      (eventsSelected)="onEventSelected($event)">
    </app-upcoming>

    <app-past
      *ngIf="selectedTab === 'past'"
      [events]="filteredEvents"
      (eventsSelected)="onEventSelected($event)">
    </app-past>

    <app-pending
      *ngIf="selectedTab === 'pending'"
      [events]="filteredEvents"
      (eventsSelected)="onEventSelected($event)">
    </app-pending>
  </div>

  <div *ngIf="searchTerm && filteredEvents.length === 0" class="no-results">
    <div class="no-results-content">
      <i class="bi bi-search" aria-hidden="true"></i>
      <h3>Không tìm thấy sự kiện</h3>
      <p>Không có sự kiện nào phù hợp với từ khóa "{{ searchTerm }}"</p>
      <button type="button" class="ev-btn ev-btn-primary" (click)="clearSearch()">
        Xóa tìm kiếm
      </button>
    </div>
  </div>
</div>
