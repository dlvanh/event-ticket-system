<div class="success-backdrop" role="dialog" aria-modal="true" aria-labelledby="success-modal-title">
  <div class="success-dialog">
    <div class="spinner-wrapper">
      <div class="spinner-ring" aria-hidden="true"></div>
      <span class="countdown-text">{{ countdown }}</span>
    </div>

    <h2 id="success-modal-title" class="success-title">{{ message }}</h2>
    <p class="success-desc">Bạn sẽ được chuyển về màn hình chính</p>
    <button type="button" class="ev-btn ev-btn-primary" (click)="goNow()">Về ngay</button>
  </div>
</div>
