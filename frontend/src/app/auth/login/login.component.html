<div class="ev-auth-shell">
  <a routerLink="/" class="ev-auth-logo" (click)="goToHome()" aria-label="Eventa - Trang chủ">
    <img src="assets/logoeventa.png" alt="Eventa" width="136" height="38" />
  </a>

  <div class="ev-auth-card">
    <h1 class="auth-title">Đăng nhập</h1>
    <p class="auth-subtitle">Chào mừng bạn quay trở lại với Eventa</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="ev-field">
        <label for="login-email" class="ev-label">Email</label>
        <input
          id="login-email"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          class="ev-input"
          autocomplete="email"
          autocapitalize="none"
          spellcheck="false"
          [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          aria-describedby="login-email-err"
        />
        <div id="login-email-err" class="ev-error-text" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <span *ngIf="loginForm.get('email')?.errors?.['email']">Email không hợp lệ.</span>
        </div>
      </div>

      <div class="ev-field">
        <label for="login-password" class="ev-label">Mật khẩu</label>
        <div class="ev-password-wrap">
          <input
            id="login-password"
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
            class="ev-input"
            [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            aria-describedby="login-pass-err"
          />
          <button
            type="button"
            class="ev-password-toggle"
            [attr.aria-pressed]="!hidePassword"
            aria-label="Hiện hoặc ẩn mật khẩu"
            (click)="togglePasswordVisibility()"
          >
            <i class="bi" [ngClass]="hidePassword ? 'bi-eye' : 'bi-eye-slash'" aria-hidden="true"></i>
          </button>
        </div>
        <div id="login-pass-err" class="ev-error-text" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Mật khẩu không được để trống.</span>
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" formControlName="rememberMe" />
          <span>Nhớ mật khẩu</span>
        </label>
        <button type="button" class="text-link-btn" (click)="forgotPassword()">Quên mật khẩu?</button>
      </div>

      <button type="submit" class="ev-btn ev-btn-primary submit-full" [disabled]="loginForm.invalid">
        Đăng nhập
      </button>

      <div *ngIf="loginErrorMessage" class="error-banner" role="alert">
        <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <span>{{ loginErrorMessage }}</span>
      </div>

      <p class="auth-footer-text">
        Chưa có tài khoản?
        <button type="button" class="text-link-btn" (click)="createAccount()">Tạo tài khoản</button>
      </p>
    </form>
  </div>
</div>

<app-toast-notification
  #notification
  (onClose)="onNotificationClose()">
</app-toast-notification>
