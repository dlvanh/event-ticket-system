<section class="ev-section">
  <div class="ev-section-header">
    <h2 class="ev-section-title">Điểm đến thú vị</h2>
  </div>

  <div class="place-list">
    <article class="place-card" *ngFor="let place of interestPlaces">
      <button type="button" class="place-trigger" (click)="onCityClick(place.name)">
        <img [src]="place.image" [alt]="place.name" loading="lazy" />
        <div class="overlay">
          <span>{{ place.name }}</span>
        </div>
      </button>
    </article>
  </div>
</section>
