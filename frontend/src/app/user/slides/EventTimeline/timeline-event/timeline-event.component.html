<section class="ev-section">
  <div class="ev-section-header">
    <div class="timeline-tabs" role="tablist" aria-label="Lịch sự kiện">
      <button
        type="button"
        role="tab"
        class="timeline-tab"
        [class.active]="selectedTab === 'thisweekend'"
        [attr.aria-selected]="selectedTab === 'thisweekend'"
        (click)="setTab('thisweekend')"
      >
        Cuối tuần
      </button>
      <button
        type="button"
        role="tab"
        class="timeline-tab"
        [class.active]="selectedTab === 'thismonth'"
        [attr.aria-selected]="selectedTab === 'thismonth'"
        (click)="setTab('thismonth')"
      >
        Tháng này
      </button>
    </div>

    <button type="button" class="ev-see-more" (click)="onSeeMore()">
      <span>Xem thêm</span>
      <i class="bi bi-chevron-right" aria-hidden="true"></i>
    </button>
  </div>

  <div class="events-list" role="tabpanel">
    <app-thisweekend-event *ngIf="selectedTab === 'thisweekend'"></app-thisweekend-event>
    <app-thismonth-event *ngIf="selectedTab === 'thismonth'"></app-thismonth-event>
  </div>

  <div class="banner-container" *ngIf="images.length > 0">
    <div class="image-container" *ngFor="let image of images">
      <img [src]="image" alt="Khám phá sự kiện nổi bật trên Eventa" loading="lazy" />
    </div>
  </div>
</section>
