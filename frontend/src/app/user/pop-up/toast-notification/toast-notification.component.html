<div class="notification-container" [class.show]="show" role="status" aria-live="polite">
  <div class="notification-box">
    <div class="notification-content">
      <div class="notification-icon" [ngSwitch]="progressBarType" aria-hidden="true">
        <i *ngSwitchCase="'success'" class="bi bi-check-circle-fill icon-success"></i>
        <i *ngSwitchCase="'error'" class="bi bi-exclamation-circle-fill icon-error"></i>
        <i *ngSwitchCase="'warning'" class="bi bi-exclamation-triangle-fill icon-warning"></i>
        <i *ngSwitchDefault class="bi bi-info-circle-fill icon-info"></i>
      </div>
      <div class="notification-message">{{ message }}</div>
      <button
        type="button"
        class="notification-close"
        (click)="closeNotification()"
        aria-label="Đóng thông báo"
      >
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </div>
    <div
      class="notification-progress"
      [ngClass]="progressBarType"
      [style.animation-duration.ms]="autoHideTime"
      *ngIf="showProgressBar && show && autoHideTime > 0">
    </div>
  </div>
</div>
