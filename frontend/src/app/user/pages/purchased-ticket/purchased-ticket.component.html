<div class="ev-section account-layout">
  <aside class="sidebar">
    <app-nav-user></app-nav-user>
  </aside>

  <section class="ev-card content-panel">
    <header class="panel-header">
      <h1 class="heading">Vé đã mua</h1>
      <button type="button" class="ev-btn ev-btn-primary" (click)="goToHome()">Mua vé ngay</button>
    </header>

    <nav class="filter-buttons" aria-label="Lọc trạng thái vé">
      <a class="filter-btn" routerLink="all" routerLinkActive="active">Tất cả</a>
      <a class="filter-btn" routerLink="success" routerLinkActive="active">Thành công</a>
      <a class="filter-btn" routerLink="processing" routerLinkActive="active">Đang xử lý</a>
      <a class="filter-btn" routerLink="cancel" routerLinkActive="active">Đã hủy</a>
    </nav>

    <div class="events-list">
      <router-outlet></router-outlet>
    </div>
  </section>
</div>
