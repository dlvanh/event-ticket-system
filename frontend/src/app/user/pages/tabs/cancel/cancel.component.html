<div *ngIf="ticketOrders?.length === 0" class="ev-empty-tickets">
  <img
    src="https://storage.googleapis.com/a1aa/image/b4fbff74-75c2-4142-93e6-acdbad673655.jpg"
    alt=""
    width="160"
    height="160"
    loading="lazy"
  />
  <p>Bạn chưa có vé nào</p>
</div>

<div class="ev-ticket-list" *ngIf="ticketOrders.length > 0">
  <ng-container *ngFor="let order of ticketOrders">
    <ng-container *ngFor="let ticket of order.tickets">
      <article class="ev-ticket-card">
        <div class="ev-ticket-stub">
          <div class="ev-ticket-type">{{ ticket.ticketType }}</div>
          <span class="ev-ticket-status cancelled">{{ order.status | statusTranslate }}</span>
        </div>

        <div class="ev-ticket-main">
          <div class="ev-ticket-info">
            <div>
              <h2 class="ev-ticket-name">{{ ticket.eventName }}</h2>
              <p class="ev-ticket-meta">
                {{ ticket.eventStartTime | date: 'HH:mm · dd/MM/yyyy' }} ·
                {{ ticket.unitPrice | number:'1.0-0' }}đ × {{ ticket.quantity }}
              </p>
            </div>
          </div>
          <p class="ev-ticket-loc">{{ ticket.eventLocation }}</p>
        </div>
      </article>
    </ng-container>
  </ng-container>
</div>
