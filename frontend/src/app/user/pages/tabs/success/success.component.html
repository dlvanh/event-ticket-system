<div class="page-container">
  <div class="ev-status-toggle" role="tablist" aria-label="Thời gian sự kiện">
    <button
      type="button"
      role="tab"
      class="ev-toggle-btn"
      (click)="setTab('coming')"
      [class.active]="selectedTab === 'coming'"
      [attr.aria-selected]="selectedTab === 'coming'"
    >
      Sắp diễn ra
    </button>
    <button
      type="button"
      role="tab"
      class="ev-toggle-btn"
      (click)="setTab('ended')"
      [class.active]="selectedTab === 'ended'"
      [attr.aria-selected]="selectedTab === 'ended'"
    >
      Đã kết thúc
    </button>
  </div>

  <div *ngIf="ticketOrders?.length === 0" class="ev-empty-tickets">
    <img
      src="https://storage.googleapis.com/a1aa/image/b4fbff74-75c2-4142-93e6-acdbad673655.jpg"
      alt=""
      width="160"
      height="160"
      loading="lazy"
    />
    <p>Bạn chưa có vé nào</p>
  </div>

  <div class="ev-ticket-list" *ngIf="ticketOrders.length > 0">
    <ng-container *ngFor="let order of ticketOrders">
      <ng-container *ngFor="let ticket of order.tickets">
        <article class="ev-ticket-card">
          <div class="ev-ticket-stub">
            <div class="ev-ticket-type">{{ ticket.ticketType }}</div>
            <span class="ev-ticket-status paid">{{ order.status | statusTranslate }}</span>
          </div>

          <div class="ev-ticket-main">
            <div class="ev-ticket-info">
              <img
                *ngIf="ticket.qrCode"
                class="ev-ticket-qr"
                [src]="'data:image/png;base64,' + ticket.qrCode"
                alt="Mã QR vé {{ ticket.eventName }}"
              />
              <div>
                <h2 class="ev-ticket-name">{{ ticket.eventName }}</h2>
                <p class="ev-ticket-meta">
                  {{ ticket.eventStartTime | date: 'HH:mm · dd/MM/yyyy' }} ·
                  {{ ticket.unitPrice | number:'1.0-0' }}đ × {{ ticket.quantity }}
                </p>
              </div>
            </div>
            <p class="ev-ticket-loc">{{ ticket.eventLocation }}</p>
          </div>
        </article>
      </ng-container>
    </ng-container>
  </div>
</div>
