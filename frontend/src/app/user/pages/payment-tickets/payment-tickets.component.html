<div class="ev-section payment-qr-page">
  <section class="ev-card payment-box">
    <h1 class="title">Thanh toán bằng VNPAY</h1>

    <div class="qr-layout">
      <div class="qr-box">
        <img
          src="https://storage.googleapis.com/a1aa/image/ddf33434-c4aa-40e4-8db9-8c483d345547.jpg"
          alt="Mã QR thanh toán VNPAY"
          class="qr-image"
        />
        <p class="total-amount">Tổng tiền: <strong>660.000 đ</strong></p>
      </div>

      <div class="instructions">
        <ol class="step-list">
          <li class="step-item">
            <span class="step-number">1</span>
            <p class="step-text">Mở ứng dụng Ngân hàng trên điện thoại</p>
          </li>
          <li class="step-item">
            <span class="step-number">2</span>
            <p class="step-text">Chọn biểu tượng Quét mã QR</p>
          </li>
          <li class="step-item">
            <span class="step-number">3</span>
            <p class="step-text">Quét mã QR ở trang này</p>
          </li>
          <li class="step-item">
            <span class="step-number">4</span>
            <p class="step-text">Thực hiện thanh toán và chờ xem thông báo giao dịch</p>
          </li>
        </ol>

        <div class="countdown-box">
          <p class="countdown-label">Giao dịch sẽ kết thúc sau</p>
          <div class="timer-display">
            <span class="time-unit">{{ minutes }}</span>
            <span class="separator">:</span>
            <span class="time-unit">{{ seconds }}</span>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
