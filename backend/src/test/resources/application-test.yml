spring:
  datasource:
    url: jdbc:h2:mem:ticketdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret

app:
  mail:
    from: test@eventa.local
  cors:
    allowed-origins: http://localhost:4200
  qr:
    signing-secret: test-only-qr-signing-secret-with-at-least-32-bytes-length

jwt:
  secret: test-only-jwt-secret-key-with-more-than-sixty-four-bytes-for-hs512-signing-123456
  expiration-ms: 3600000

imgbb:
  api:
    key: test-imgbb-key

gemini:
  api:
    key: test-gemini-key

payos:
  client-id: test-payos-client-id
  api-key: test-payos-api-key
  checksum-key: test-payos-checksum-key

logging:
  level:
    com.example.event_ticket_system: WARN
